*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.65}

h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:.12em}

main{padding:12px 18px 100px;max-width:640px;margin:0 auto}
.map{border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:2px 0 12px;isolation:isolate}
#map{height:300px;width:100%}
.pin{width:26px;height:26px;border-radius:4px;background:var(--red);color:#fff;border:2px solid #fff;font:800 13px/22px "Shippori Mincho",serif;text-align:center;box-shadow:0 1px 4px #0007}
.pin.on{background:var(--ind);transform:scale(1.25)}
ol{list-style:none;margin:0;padding:0}
li,.card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:8px}
li.on{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.n{flex:0 0 28px;height:28px;border-radius:4px;background:var(--red);color:#fff;font:800 .9rem "Shippori Mincho",serif;display:grid;place-items:center}
.b{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.hr,.sum,.sub{font-size:.85rem;color:var(--sub)}
.sum{margin:0 0 10px}
.go{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:.85rem}
.go a,.lk{color:var(--ind);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.leg{margin:-2px 0 8px 40px;font-size:.82rem;color:var(--sub);border-left:3px solid var(--gold);padding-left:10px}
.pk{margin-top:6px;font-size:.82rem;color:var(--sub)}
.pk b{color:var(--ink)}.pk div{padding:2px 0}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#bar button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-weight:800;font-family:"Shippori Mincho",serif;font-size:1.05rem;letter-spacing:.1em;padding:12px 2px;cursor:pointer}
#bar button[aria-selected="true"]{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.add{display:flex;gap:8px;margin:6px 0 12px}
.add input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.btn{font:inherit;border:1px solid var(--ind);background:var(--ind);color:#f4efe4;border-radius:4px;padding:7px 14px;cursor:pointer}
.btn.o{background:none;color:var(--ink);border-color:var(--line)}
.it{align-items:center}.it.done .t{text-decoration:line-through;color:var(--sub)}
.it input{width:20px;height:20px;accent-color:#c8372d}
details{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
summary{padding:12px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";margin-left:auto;color:var(--red)}
details[open] summary::after{content:"－"}
.dt{padding:0 12px 12px;font-size:.92rem}
.dt img{width:100%;border-radius:4px;margin:8px 0}
.ok{color:var(--red);font-weight:800}
.dt label{display:inline-block;margin:6px 10px 0 0}
.empty{color:var(--sub);font-size:.9rem}
</style>
</head>

var $=function(i){return document.getElementById(i)},tabs=$("tabs"),view=$("view"),cur=0,sel=-1,map,mk=[],routeL,parkL,routes={},parks={},PG={};
function q(s){return encodeURIComponent(s)}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function J(k,v){try{if(v===undefined){var x=JSON.parse(localStorage.getItem(k));return x}localStorage.setItem(k,JSON.stringify(v))}catch(e){}return v===undefined?null:v}
function icon(i,on){return L.divIcon({className:"",html:'<div class="pin'+(on?' on':'')+'">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]})}
function fmt(sec){var m=Math.round(sec/60);return m>=60?Math.floor(m/60)+" 小時 "+(m%60)+" 分":m+" 分"}
function initMap(){
  map=L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
  parkL=L.layerGroup().addTo(map);routeL=L.layerGroup().addTo(map);
}
function drawMap(){
  mk.forEach(function(m){m.remove()});mk=[];parkL.clearLayers();routeL.clearLayers();
  var pts=D[cur][1],ll=pts.map(function(p){return [p[1],p[2]]});
  routeL.addLayer(L.polyline(ll,{color:"#c8372d",weight:3,opacity:.6,dashArray:"6 6"}));
  pts.forEach(function(p,i){var m=L.marker(ll[i],{icon:icon(i,false)}).addTo(map);m.on("click",function(){pick(i,false)});mk.push(m)});
  map.fitBounds(L.latLngBounds(ll).pad(.2),{maxZoom:15});

function list(){
  var pts=D[cur][1],h='<ol>';

    h+='<li data-i="'+i+'" tabindex="0"><span class="n">'+(i+1)+'</span><div class="b"><div class="t">'+esc(p[0])+'</div>'+(p[3]?'<div class="hr">營業時間　'+esc(p[3])+'</div>':'')+'<div class="go"><a href="https://maps.apple.com/?ll='+p[1]+','+p[2]+'&q='+q(p[0])+'">Apple 地圖</a><a href="https://www.google.com/maps/search/?api=1&query='+p[1]+','+p[2]+'" target="_blank" rel="noopener">Google 地圖</a></div><div class="pk" id="pk'+i+'"></div></div></li>';

function applyRoute(d){
  var r=routes[d];if(d!==cur||!r)return;
  routeL.clearLayers();
  routeL.addLayer(L.geoJSON(r.geometry,{style:{color:"#2c5aa0",weight:5,opacity:.85}}));
  r.legs.forEach(function(l,i){var e=$("leg"+i);if(e)e.textContent="自駕 約 "+fmt(l.duration)+"・"+(l.distance/1000).toFixed(1)+" km"});
  $("sum").textContent="當日自駕合計約 "+fmt(r.duration)+"・"+(r.distance/1000).toFixed(0)+" km（不含停留時間）";
}
function loadRoute(d){
  var pts=D[d][1];$("sum").textContent="";
  if(routes[d])return applyRoute(d);
  var u="https://router.project-osrm.org/route/v1/driving/"+pts.map(function(p){return p[2]+","+p[1]}).join(";")+"?overview=full&geometries=geojson";
  fetch(u).then(function(r){return r.json()}).then(function(j){if(j.code!=="Ok")throw 0;routes[d]=j.routes[0];applyRoute(d)})

/* 停車場 */
function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos(a*r);return Math.sqrt(x*x+y*y)*6371000}
function fetchDay(d){
  if(parks[d])return Promise.resolve(parks[d]);
  var c=J("pk");if(c&&c[d]){parks[d]=c[d];return Promise.resolve(c[d])}
  var pts=D[d][1],qs='[out:json][timeout:25];('+pts.map(function(p){return 'nwr["amenity"="parking"](around:400,'+p[1]+','+p[2]+');'}).join("")+');out center tags;';
  function go(base){return fetch(base+"?data="+q(qs)).then(function(r){if(!r.ok)throw 0;return r.json()})}
  return go("https://overpass-api.de/api/interpreter").catch(function(){return go("https://overpass.kumi.systems/api/interpreter")}).then(function(j){
    var all=j.elements.filter(function(x){return (x.tags||{}).access!=="private"}).map(function(x){var t=x.tags||{};return {la:x.lat||(x.center&&x.center.lat),lo:x.lon||(x.center&&x.center.lon),n:t.name||"停車場",f:t.fee==="yes"?"收費":t.fee==="no"?"免費":"",c:t.capacity||""}}).filter(function(x){return x.la});
    var res=pts.map(function(p){return all.map(function(k){return {la:k.la,lo:k.lo,n:k.n,f:k.f,c:k.c,m:Math.round(dist(p[1],p[2],k.la,k.lo))}}).filter(function(k){return k.m<=400}).sort(function(a,b){return a.m-b.m}).slice(0,4)});

}

function parkPage(){

function custom(k){
  var a=ld(k);
  return '<h2 style="margin-top:20px">'+LP[k]+'</h2><div class="add"><input id="in-'+k+'" placeholder="新增項目" maxlength="80"><button class="btn" data-a="add">新增</button></div>'+
  (a.length?'<ol>'+a.map(function(x,i){return '<li class="it'+(x.d?' done':'')+'"><input type="checkbox" data-a="tg" data-i="'+i+'"'+(x.d?' checked':'')+'><div class="b"><div class="t">'+esc(x.t)+'</div></div><button class="btn o" data-a="rm" data-i="'+i+'">刪除</button></li>'}).join("")+'</ol>':'<p class="empty">還沒有項目。</p>');
}
function giftPage(){
  var bought=J("gb")||{},ph=J("gp")||{},open=PG.open;
  var h='<h2>大分の土産</h2><p class="sub">點開看介紹。資料整理自 <a class="lk" href="https://kyushu.letsgojp.com/archives/539884/" target="_blank" rel="noopener">樂吃購！日本 九州版</a>。</p>';
  G.forEach(function(g,i){
    h+='<details data-g="'+i+'"'+(open===i?' open':'')+'><summary><span class="n">'+(i+1)+'</span><div class="b"><div class="t">'+esc(g[0])+(bought[i]?'　<span class="ok">已購</span>':'')+'</div><div class="sub">'+esc(g[1])+'</div></div></summary><div class="dt"><div>'+esc(g[2])+'</div>'+
    (ph[i]?'<img src="'+ph[i]+'" alt="'+esc(g[0])+'">':'')+
    '<div class="go"><a href="'+g[3]+'" target="_blank" rel="noopener">官網／購買</a><a href="https://www.google.com/search?tbm=isch&q='+q(g[0]+" "+g[1])+'" target="_blank" rel="noopener">看商品照片</a></div>'+
    '<label><input type="checkbox" data-a="bt" data-i="'+i+'"'+(bought[i]?' checked':'')+'> 已購買</label><label class="lk">'+(ph[i]?'更換':'加入')+'我的照片<input type="file" accept="image/*" data-a="ph" data-i="'+i+'" hidden></label></div></details>'});
  $("p-gift").innerHTML=h+custom("gift");
}
function page(k){if(k==="gift")giftPage();else if(k==="memo")$("p-memo").innerHTML=custom("memo");else if(k==="park")parkPage()}
["gift","memo"].forEach(function(k){
  var el=$("p-"+k);
  el.addEventListener("toggle",function(e){if(e.target.dataset&&e.target.dataset.g!==undefined&&e.target.open)PG.open=+e.target.dataset.g},true);
  el.addEventListener("click",function(e){
    var b=e.target.closest("[data-a]");if(!b||b.tagName==="INPUT"&&b.type==="file")return;
    var a=ld(k),i=+b.dataset.i,t=b.dataset.a;
    if(t==="bt"){var m=J("gb")||{};m[i]=b.checked?1:0;J("gb",m);PG.open=i;return giftPage()}
    if(t==="add"){var v=$("in-"+k).value.trim();if(v)a.push({t:v,d:0})}
    else if(t==="tg")a[i].d=a[i].d?0:1;
    else if(t==="rm")a.splice(i,1);else return;
    sv(k,a);page(k)});
  el.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.type==="text"){var v=e.target.value.trim();if(v){var a=ld(k);a.push({t:v,d:0});sv(k,a);page(k)}}});
});
$("p-gift").addEventListener("change",function(e){
  var f=e.target;if(f.dataset.a!=="ph"||!f.files[0])return;
  var i=+f.dataset.i,r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,640/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    var m=J("gp")||{};m[i]=c.toDataURL("image/jpeg",.7);J("gp",m);PG.open=i;giftPage()};im.src=r.result};
  r.readAsDataURL(f.files[0]);
});
$("bar").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var p=b.dataset.p;
  document.querySelectorAll("#bar button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
  ["trip","park","gift","memo"].forEach(function(k){$("p-"+k).hidden=k!==p});
  if(p!=="trip")page(p);else setTimeout(function(){map.invalidateSize()},50);
  window.scrollTo(0,0);
});
var s0=J("day");if(s0>=0&&s0<D.length)cur=+s0;
initMap();draw();
</script>
</body>
</html>
