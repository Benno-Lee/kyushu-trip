<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅の栞">
<title>旅の栞｜佐賀・大分</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
:root{--bg:#f4f2ec;--card:#fbfaf6;--ink:#1d2430;--sub:#6b7280;--line:#dcd7ca;--ai:#264a6e;--shu:#c9432e;--onai:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1a2029;--ink:#e9e6df;--sub:#9aa3b0;--line:#2b3340;--ai:#7fa6cf;--shu:#e8654d;--onai:#10151c}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1a2029;--ink:#e9e6df;--sub:#9aa3b0;--line:#2b3340;--ai:#7fa6cf;--shu:#e8654d;--onai:#10151c}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6}
header{padding:22px 18px 6px;display:flex;align-items:baseline;gap:12px;max-width:640px;margin:0 auto}
h1{margin:0;font-family:"Zen Old Mincho","Noto Serif TC",serif;font-weight:900;font-size:1.9rem;letter-spacing:.12em}
header p{margin:0;color:var(--sub);font-size:.85rem}
main{max-width:640px;margin:0 auto;padding:0 18px}
#days,.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
#days button,.chips button{flex:0 0 auto;background:var(--card);color:var(--sub);border:1px solid var(--line);font:inherit;font-weight:700;padding:7px 14px;border-radius:2px;cursor:pointer}
#days button[aria-selected=true],.chips button[aria-selected=true]{color:var(--ink);border-color:var(--shu);box-shadow:inset 0 -3px 0 var(--shu)}
.map{isolation:isolate;border:1px solid var(--line);overflow:hidden}
#map{height:300px;width:100%}
.pin{width:26px;height:26px;border-radius:50%;background:var(--ai);color:var(--onai);border:2px solid var(--bg);font:900 12px/22px sans-serif;text-align:center;box-shadow:0 1px 4px #0006}
.pin.on{background:var(--shu);color:#fff;transform:scale(1.25)}
#sum{font-size:.8rem;color:var(--sub);margin:8px 0 12px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);padding:12px;cursor:pointer}
.card.on{border-color:var(--shu);box-shadow:0 0 0 1px var(--shu)}
.n{flex:0 0 26px;height:26px;background:var(--shu);color:#fff;font-weight:900;font-size:.8rem;display:grid;place-items:center}
.b{flex:1;min-width:0}
.t{font-weight:700;overflow-wrap:anywhere}
.t.got{text-decoration:line-through;opacity:.55}
.hr{font-size:.82rem;color:var(--sub)}
.go{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-size:.85rem}
.go a{color:var(--ai);text-underline-offset:3px;padding:4px 0}
.st{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px dashed var(--line);color:var(--sub)}
.n.s{background:var(--ai);color:var(--onai)}
.pin.s{background:var(--sub);color:var(--bg)}
.leg{margin:0 0 0 12px;padding:7px 0 7px 22px;border-left:2px dotted var(--ai);font-size:.8rem;color:var(--ai)}
a:focus-visible,button:focus-visible,.card:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.gh{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0}
h2{margin:0;font-family:"Zen Old Mincho",serif;font-size:1.4rem;letter-spacing:.1em}
h3{font-family:"Zen Old Mincho",serif;margin:18px 0 8px;font-size:1.05rem;border-left:4px solid var(--shu);padding-left:8px}
.gi{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px;margin-bottom:6px;cursor:pointer}
.th{flex:0 0 54px;height:54px;background:var(--line);display:grid;place-items:center;overflow:hidden;font-weight:900;font-size:1.3rem;color:var(--ai)}
.th img,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.gi .hr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{display:flex;gap:4px;align-items:center;font-size:.8rem;color:var(--sub);padding:8px 2px;cursor:pointer}
.btn{font:inherit;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;display:inline-block}
.btn.pri{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.danger{color:var(--shu);border-color:var(--shu)}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:1000}
#bar button{flex:1;background:none;border:0;font:inherit;font-weight:700;color:var(--sub);padding:14px 0;cursor:pointer}
#bar button[aria-selected=true]{color:var(--shu);box-shadow:inset 0 3px 0 var(--shu)}
.ov{position:fixed;inset:0;background:#0008;z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));border-radius:12px 12px 0 0}
.ph{height:200px;background:var(--line);display:grid;place-items:center;overflow:hidden;margin-bottom:10px;color:var(--sub)}
label{display:block;font-size:.85rem;color:var(--sub)}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;margin:4px 0 10px}
input[type=checkbox]{width:auto;margin:0}
label.row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.gp{font-size:.8rem;color:var(--ai);text-underline-offset:3px;display:inline-block;padding:2px 0}
.gi .hr.mt{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;color:var(--ink)}
.sum{background:var(--card);border:1px solid var(--line);padding:14px;margin:12px 0}
.big{font-family:"Zen Old Mincho",serif;font-size:2rem;font-weight:900;line-height:1.2}
.bar{display:grid;grid-template-columns:60px 1fr auto;gap:8px;align-items:center;font-size:.85rem;margin-top:6px}
.bar i{display:block;height:8px;background:var(--shu)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp button{font:inherit;font-size:1.3rem;font-weight:700;padding:14px 0;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.kp .op{color:var(--shu)}
.kp .eq{background:var(--shu);color:#fff;border-color:var(--shu);grid-row:span 2}
.kp .z{grid-column:span 2}
#cdisp{font-size:2.2rem;font-weight:900;text-align:right;min-height:3rem;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<header><h1>旅の栞</h1><p>佐賀・大分　五日間の自駕旅</p></header>
<main>
<section id="p-plan">
 <nav id="days" role="tablist"></nav>
 <div class="map"><div id="map"></div></div>
 <div id="sum"></div>
 <div id="view"></div>
</section>
<section id="p-money" hidden>
 <div class="gh"><h2>記帳</h2><div style="display:flex;gap:8px"><button class="btn" id="mcalc">計算機</button><button class="btn pri" id="xadd">＋記一筆</button></div></div>
 <div class="sum"><div class="hr">合計</div><div class="big" id="mtot"></div><div class="hr" id="mtw"></div>
  <div class="hr" style="margin-top:8px">匯率　1 日圓 ≈ NT$ <input id="rate" inputmode="decimal" style="width:80px;display:inline-block;margin:0;padding:4px 8px"></div>
  <div id="mcat" style="margin-top:8px"></div></div>
 <div class="chips" id="mchips"></div>
 <div id="elist"></div>
</section>
<section id="p-gift" hidden>
 <div class="gh"><div><h2>伴手禮</h2><div class="hr" id="gcount"></div></div><button class="btn pri" id="gadd">＋新增</button></div>
 <div id="glist"></div>
</section>
<section id="p-memo" hidden>
 <div class="gh"><div><h2>備忘錄</h2><div class="hr">行程外的提醒、預約、想問的事都記這裡</div></div><button class="btn pri" id="madd">＋新增</button></div>
 <div id="mlist" style="margin-top:12px"></div>
</section>
</main>
<nav id="bar"></nav>
<div id="ed" class="ov" hidden><div class="sheet">
 <div class="ph" id="eph"></div>
 <div style="margin-bottom:12px"><label class="btn" style="display:inline-block;color:var(--ink)">選擇／拍攝照片<input type="file" id="efile" accept="image/*" hidden></label> <button class="btn" id="erm">移除照片</button></div>
 <label>名稱<input id="en"></label>
 <label>地區<input id="ea" list="areas" placeholder="佐賀／大分／其他"></label><datalist id="areas"><option value="佐賀"><option value="大分"><option value="其他"></datalist>
 <label>簡介<textarea id="ei" rows="4"></textarea></label>
 <label class="row"><input type="checkbox" id="eg">已購買</label>
 <div style="margin-bottom:12px"><button class="btn" id="egp">在 Google 圖片看這個項目的照片</button></div>
 <div class="acts"><button class="btn danger" id="edel">刪除</button><button class="btn" id="ecl">取消</button><button class="btn pri" id="esv">儲存</button></div>
</div></div>
<div id="xo" class="ov" hidden><div class="sheet">
 <label for="xa">金額</label>
 <div style="display:flex;gap:8px"><input id="xa" inputmode="decimal" placeholder="0"><button class="btn" id="xcalc" style="margin-bottom:10px">計算機</button></div>
 <label for="xcur">幣別</label><select id="xcur"><option value="JPY">日圓 ¥</option><option value="TWD">台幣 NT$</option></select>
 <label for="xcat">分類</label><select id="xcat"></select>
 <label for="xd">日期</label><input type="date" id="xd">
 <label for="xn">備註</label><input id="xn" placeholder="例如：一蘭拉麵">
 <div class="acts"><button class="btn danger" id="xdel">刪除</button><button class="btn" id="xcl">取消</button><button class="btn pri" id="xsv">儲存</button></div>
</div></div>
<div id="co" class="ov" hidden><div class="sheet">
 <div id="cdisp">0</div><div class="hr" id="chint" style="min-height:1.5rem;text-align:right;margin-bottom:10px"></div>
 <div class="kp" id="ckp">
  <button data-k="C" class="op">C</button><button data-k="B" class="op">⌫</button><button data-k="÷" class="op">÷</button><button data-k="×" class="op">×</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="−" class="op">−</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="+" class="op">+</button>
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="=" class="eq">=</button>
  <button data-k="0" class="z">0</button><button data-k=".">.</button>
 </div>
 <div class="acts" style="margin-top:12px"><button class="btn" id="ccl">關閉</button><button class="btn pri" id="cuse">帶入金額</button></div>
</div></div>
<div id="mo" class="ov" hidden><div class="sheet">
 <label>標題<input id="mti" placeholder="例如：租車取車時間"></label>
 <label>內容<textarea id="mbo" rows="9"></textarea></label>
 <div class="acts"><button class="btn danger" id="mdel">刪除</button><button class="btn" id="mcl">取消</button><button class="btn pri" id="msv">儲存</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const D=[["DAY1",[["佐賀機場",33.1505692,130.3018177],["大魚神社海中鳥居",33.0312525,130.1777484,"","海中鳥居受潮汐影響，出發前請查當天潮汐時間"],["祐德稻荷神社",33.073778,130.1079317,"境內可自由參拜；授與所約 8:30–16:30（依現場公告為準）",""],["肥前浜宿酒蔵通り",33.0924071,130.1151793],["HOTEL R9 The Yard 佐賀鹿島",33.1206823,130.091994],["(株)村岡屋 鹿島店",33.1106366,130.0875857],["Honbaindoryori Purunima",33.1169116,130.0976374],["SuperCenterTRIAL KASHIMA",33.1232278,130.0980338],["Tamagoya",33.1184214,130.0938714],["Cake & Coffee Hinodeya",33.1200037,130.0917223]],null],["DAY2",[["Takeoonsen Bussankan Parking Lot",33.1967509,130.0324718],["武雄溫泉 樓門",33.1962371,130.0146614],["佐嘉平川屋（武雄溫泉 本店）",33.196222,130.0150825],["武雄神社",33.1881294,130.0209037],["御船山樂園",33.1823029,130.0179788],["武雄市圖書館·歷史資料館",33.1890331,130.0236947,"圖書館 9:00–21:00，全年無休；歷史資料館 9:00–17:00",""],["youme Town 武雄",33.1887364,130.0251081],["emi cafe",33.1924523,130.0219193],["武雄 旅 書店",33.1960484,130.0229315],["中央飯店 武雄",33.1954133,130.0231871]],["HOTEL R9 The Yard 佐賀鹿島",33.1206823,130.091994]],["DAY3",[["湯布院駅前",33.2629542,131.3555275],["Siesta Organic Cafe",33.264324,131.3581301],["湯之坪街道",33.2673861,131.3645627],["原っぱカフェ Harappa Cafe",33.2678752,131.3636902],["Kagura",33.2683142,131.3643622],["湯布院shiitakemonster",33.2678453,131.3655786],["金鱗湖",33.2666644,131.3690272],["Traditional Japanese inn Ryokan Hachisunoito",33.266614,131.3518159]],["中央飯店 武雄",33.1954133,130.0231871]],["DAY4",[["九州自然動物園",33.3509251,131.4137658],["地獄蒸布丁 岡本屋",33.3180542,131.4526114],["別府地獄之旅",33.3158833,131.4696745,"","各地獄多在傍晚前停止入場，請確認最晚入場時間"],["Avatar印度餐廳",33.3151846,131.4723939],["地獄蒸工房 鐵輪",33.3154852,131.4762201],["別府塔",33.2817713,131.5059174],["Noodle Factory Life",33.2775997,131.5039761],["Umi no Hotel Hajime",33.2813065,131.507277]],["Traditional Japanese inn Ryokan Hachisunoito",33.266614,131.3518159]],["DAY5",[["車站町一丁目 別府",33.2798442,131.5003895],["別府站市場",33.2769657,131.4992579],["竹瓦小路",33.2770334,131.5059114],["大分機場",33.4796632,131.7362008,"","請預留還車、加油與報到的充裕時間"]],["Umi no Hotel Hajime",33.2813065,131.507277]]];
const DAYN=["一日目","二日目","三日目","四日目","五日目"];
const TABS=[["plan","旅程"],["money","記帳"],["gift","伴手禮"],["memo","備忘錄"]];
const DEF=[
["丸ぼうろ","佐賀","佐賀的傳統烘焙點心，口感鬆脆、蛋香樸實，源自南蠻菓子的流傳。"],
["小城羊羹","佐賀","表面帶一層薄糖殼、內裡綿密的紅豆羊羹，是小城的代表名產，行程中的村岡屋以羊羹聞名。"],
["嬉野茶","佐賀","嬉野以圓潤柔和的玉綠茶聞名，茶葉輕巧好攜帶，適合送禮。"],
["有田燒","佐賀","日本具代表性的瓷器，杯盤小物都適合當紀念品，記得請店家用緩衝材包好。"],
["佐賀海苔","佐賀","佐賀有明海一帶是海苔重要產地，包裝輕薄，送禮自用都方便。"],
["地獄蒸しプリン","大分","別府用溫泉蒸氣蒸出的布丁，蛋味濃、口感紮實，岡本屋是行程中的名店，建議現場品嚐。"],
["湯の花","大分","別府明礬溫泉的湯之花，加在浴缸裡就能在家重現溫泉氛圍。"],
["ざびえる","大分","大分知名洋菓子，酥皮包著奶油餡，名字取自傳教士沙勿略。"],
["かぼす製品","大分","臭橙（カボス）是大分特產，有果醋、果汁、調味料等多種加工品。"],
["麥燒酎","大分","大分以麥燒酎聞名，常見品牌有いいちこ、二階堂等；攜帶酒類請留意航空與入境規定。"]];
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur=0,sel=-1,map,mk=[],base,drive,smk;const R={},bad={};
const pin=(i,on)=>L.divIcon({className:"",html:`<div class="pin${on?" on":""}">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
const fmt=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+" 小時 "+(m%60)+" 分":m+" 分"};
function initMap(){map=L.map("map");L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map)}
function list(){
 const day=D[cur],pts=day[1],st=day[2],off=st?1:0,r=R[cur];let h="";
 const leg=i=>{const l=r&&r.legs[i];return `<div class="leg">${l?`↓ 自駕約 ${fmt(l.duration)}・${(l.distance/1000).toFixed(1)} km`:"↓"}</div>`};
 if(st)h+=`<div class="st"><span class="n s">起</span><div class="b"><div class="t">出發　${esc(st[0])}</div></div></div>`+leg(0);
 pts.forEach((p,i)=>{
  h+=`<div class="card${i===sel?" on":""}" data-i="${i}" tabindex="0"><span class="n">${i+1}</span><div class="b"><div class="t">${esc(p[0])}</div>${p[3]?`<div class="hr">營業時間　${esc(p[3])}</div>`:""}${p[4]?`<div class="hr">提醒　${esc(p[4])}</div>`:""}<div class="go"><a href="https://maps.apple.com/?ll=${p[1]},${p[2]}&q=${encodeURIComponent(p[0])}">Apple 地圖</a><a href="https://www.google.com/maps/search/?api=1&query=${p[1]},${p[2]}" target="_blank" rel="noopener">Google 地圖</a><a href="https://www.google.com/maps/search/${encodeURIComponent("駐車場")}/@${p[1]},${p[2]},17z" target="_blank" rel="noopener">附近停車場</a></div></div></div>`;
  if(i<pts.length-1)h+=leg(i+off);
 });
 $("#view").innerHTML=h;
}
function summary(){const r=R[cur];$("#sum").textContent=r?`全日自駕約 ${fmt(r.duration)}・${Math.round(r.distance/1000)} km（不含停留，實際依路況與收費道路而定）`:bad[cur]?"路線暫時無法取得，需要網路連線":"路線計算中…"}
const wpts=()=>(D[cur][2]?[D[cur][2]]:[]).concat(D[cur][1]);
function drawRoute(){
 const d=cur;
 const show=r=>{if(d!==cur)return;drive&&drive.remove();base&&base.remove();drive=L.polyline(r.geometry.coordinates.map(c=>[c[1],c[0]]),{color:"#c9432e",weight:4,opacity:.85}).addTo(map);list();summary()};
 if(R[d])return show(R[d]);
 const c=wpts().map(p=>p[2]+","+p[1]).join(";");
 fetch("https://router.project-osrm.org/route/v1/driving/"+c+"?overview=full&geometries=geojson").then(r=>r.json()).then(j=>{if(j.code!=="Ok")throw 0;R[d]=j.routes[0];delete bad[d];show(R[d])}).catch(()=>{bad[d]=1;if(d===cur)summary()});
}
function drawMap(){
 mk.forEach(m=>m.remove());mk=[];smk&&smk.remove();smk=null;base&&base.remove();drive&&drive.remove();
 const ll=D[cur][1].map(p=>[p[1],p[2]]);
 base=L.polyline(wpts().map(p=>[p[1],p[2]]),{color:"#c9432e",weight:2,opacity:.5,dashArray:"5 6"}).addTo(map);
 ll.forEach((x,i)=>{const m=L.marker(x,{icon:pin(i,false)}).addTo(map);m.on("click",()=>pick(i,false));mk.push(m)});
 const st=D[cur][2];
 if(st)smk=L.marker([st[1],st[2]],{icon:L.divIcon({className:"",html:'<div class="pin s">起</div>',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
 map.fitBounds(L.latLngBounds(ll).pad(.2),{maxZoom:15});
 setTimeout(()=>map.invalidateSize(),60);
 drawRoute();
}
function pick(i,pan){
 sel=i;const cs=document.querySelectorAll("#view .card");
 cs.forEach((c,k)=>c.classList.toggle("on",k===i));
 mk.forEach((m,k)=>m.setIcon(pin(k,k===i)));
 const p=D[cur][1][i];
 if(pan){map.flyTo([p[1],p[2]],Math.max(map.getZoom(),15),{duration:.6});$("#map").scrollIntoView({block:"center",behavior:"smooth"})}
 else cs[i].scrollIntoView({block:"nearest",behavior:"smooth"});
}
function days(){$("#days").innerHTML=DAYN.map((n,i)=>`<button role="tab" aria-selected="${i===cur}" data-d="${i}">${n}</button>`).join("")}
function setDay(i){cur=i;sel=-1;try{localStorage.setItem("day",i)}catch(e){}days();list();summary();drawMap();}
$("#days").onclick=e=>{const b=e.target.closest("button");if(b)setDay(+b.dataset.d)};
$("#view").onclick=e=>{if(e.target.closest("a"))return;const c=e.target.closest(".card");if(c)pick(+c.dataset.i,true)};
function tab(k){
 TABS.forEach(([id])=>{$("#p-"+id).hidden=id!==k});
 document.querySelectorAll("#bar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k));
 if(k==="plan")setTimeout(()=>map.invalidateSize(),50);
 window.scrollTo(0,0);
}
$("#bar").innerHTML=TABS.map(([k,n])=>`<button data-k="${k}">${n}</button>`).join("");
$("#bar").onclick=e=>{const b=e.target.closest("button");if(b)tab(b.dataset.k)};

let G;try{G=JSON.parse(localStorage.getItem("gifts"))}catch(e){}
if(!Array.isArray(G))G=DEF.map((x,i)=>({id:"d"+i,name:x[0],area:x[1],intro:x[2],photo:"",got:false}));
const save=()=>{try{localStorage.setItem("gifts",JSON.stringify(G))}catch(e){alert("儲存空間不足，請刪除一些照片後再試")}};
const gimg=g=>"https://www.google.com/search?tbm=isch&q="+encodeURIComponent((g.name||"")+" "+(g.area||""));
function gifts(){
 const areas=[...new Set(G.map(g=>g.area||"其他"))];
 $("#glist").innerHTML=G.length?areas.map(a=>`<h3>${esc(a)}</h3>`+G.filter(g=>(g.area||"其他")===a).map(g=>`<div class="gi" data-id="${g.id}"><div class="th">${g.photo?`<img src="${g.photo}" alt="">`:esc(g.name[0])}</div><div class="b"><div class="t${g.got?" got":""}">${esc(g.name)}</div><div class="hr">${esc(g.intro)}</div><a class="gp" href="${gimg(g)}" target="_blank" rel="noopener">看照片（Google 圖片）</a></div><label class="ck"><input type="checkbox" data-got="${g.id}" ${g.got?"checked":""}>已買</label></div>`).join("")).join(""):'<p class="hr">清單是空的，按右上「＋新增」加入第一個吧。</p>';
 $("#gcount").textContent=`已買 ${G.filter(g=>g.got).length} / ${G.length}`;
}
$("#glist").onclick=e=>{if(e.target.closest(".ck,a"))return;const r=e.target.closest(".gi");if(r)openEd(r.dataset.id)};
$("#glist").onchange=e=>{const id=e.target.dataset.got;if(!id)return;G.find(x=>x.id===id).got=e.target.checked;save();gifts()};
let eid=null,ephoto="";
function showPh(){$("#eph").innerHTML=ephoto?`<img src="${ephoto}" alt="">`:"<span>尚無照片</span>"}
function openEd(id){eid=id;const g=id?G.find(x=>x.id===id):{name:"",area:"",intro:"",photo:"",got:false};ephoto=g.photo;$("#en").value=g.name;$("#ea").value=g.area;$("#ei").value=g.intro;$("#eg").checked=g.got;$("#edel").hidden=!id;showPh();$("#ed").hidden=false}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(f)}
$("#efile").onchange=e=>{const f=e.target.files[0];if(f)shrink(f,d=>{ephoto=d;showPh()});e.target.value=""};
$("#erm").onclick=()=>{ephoto="";showPh()};
$("#gadd").onclick=()=>openEd(null);
$("#egp").onclick=()=>{const n=$("#en").value.trim();if(!n){$("#en").focus();return}window.open(gimg({name:n,area:$("#ea").value}),"_blank","noopener")};
$("#ecl").onclick=()=>{$("#ed").hidden=true};
$("#esv").onclick=()=>{const n=$("#en").value.trim();if(!n){$("#en").focus();return}const o={name:n,area:$("#ea").value.trim(),intro:$("#ei").value.trim(),photo:ephoto,got:$("#eg").checked};if(eid)Object.assign(G.find(x=>x.id===eid),o);else G.push({id:"u"+Date.now(),...o});save();$("#ed").hidden=true;gifts()};
$("#edel").onclick=()=>{if(confirm("確定刪除這個項目？")){G=G.filter(x=>x.id!==eid);save();$("#ed").hidden=true;gifts()}};

const CATS=["吃的","用的","紀念品","交通","住宿","其他"];
let E;try{E=JSON.parse(localStorage.getItem("exp"))}catch(e){}if(!Array.isArray(E))E=[];
let RATE=0.21;try{const r=parseFloat(localStorage.getItem("rate"));if(r>0)RATE=r}catch(e){}
const saveE=()=>{try{localStorage.setItem("exp",JSON.stringify(E))}catch(e){alert("儲存空間不足，請刪除部分紀錄後再試")}};
const nf=n=>Math.round(n).toLocaleString("en-US");
const yen=e=>e.cur==="TWD"?e.amt/RATE:e.amt;
const fm=e=>e.cur==="TWD"?"NT$"+e.amt.toLocaleString("en-US",{maximumFractionDigits:2}):"¥"+nf(e.amt);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const WD="日一二三四五六";
let filt="全部",xid=null;
function money(){
 const tot=E.reduce((a,e)=>a+yen(e),0);
 $("#mtot").textContent="¥"+nf(tot);$("#mtw").textContent="約 NT$"+nf(tot*RATE);
 const by={};E.forEach(e=>by[e.cat]=(by[e.cat]||0)+yen(e));
 const mx=Math.max(1,...Object.values(by));
 $("#mcat").innerHTML=CATS.filter(c=>by[c]).map(c=>`<div class="bar"><span>${c}</span><i style="width:${by[c]/mx*100}%"></i><b>¥${nf(by[c])}</b></div>`).join("");
 $("#mchips").innerHTML=["全部",...CATS].map(c=>`<button data-c="${c}" aria-selected="${c===filt}">${c}</button>`).join("");
 const L=E.filter(e=>filt==="全部"||e.cat===filt).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
 const sub={};L.forEach(e=>sub[e.date]=(sub[e.date]||0)+yen(e));
 let h="",d="";
 L.forEach(e=>{if(e.date!==d){d=e.date;const t=new Date(d+"T00:00:00");h+=`<h3>${t.getMonth()+1}/${t.getDate()}（${WD[t.getDay()]}）<span class="hr" style="font-weight:400">　¥${nf(sub[d])}</span></h3>`}
  h+=`<div class="gi" data-id="${e.id}"><div class="th" style="font-size:.8rem">${esc(e.cat)}</div><div class="b"><div class="t">${esc(e.note||e.cat)}</div></div><b>${fm(e)}</b></div>`});
 $("#elist").innerHTML=h||'<p class="hr">還沒有紀錄，按右上「＋記一筆」開始。</p>';
}
$("#rate").value=RATE;
$("#rate").onchange=()=>{const r=parseFloat($("#rate").value);if(r>0){RATE=r;try{localStorage.setItem("rate",r)}catch(e){}}else $("#rate").value=RATE;money()};
$("#mchips").onclick=e=>{const b=e.target.closest("button");if(b){filt=b.dataset.c;money()}};
$("#elist").onclick=e=>{const r=e.target.closest(".gi");if(r)openX(r.dataset.id)};
$("#xcat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
function openX(id){xid=id;const e=id?E.find(x=>x.id===id):{amt:"",cur:"JPY",cat:CATS[0],date:today(),note:""};$("#xa").value=e.amt;$("#xcur").value=e.cur;$("#xcat").value=e.cat;$("#xd").value=e.date;$("#xn").value=e.note;$("#xdel").hidden=!id;$("#xo").hidden=false}
$("#xadd").onclick=()=>openX(null);
$("#xcl").onclick=()=>{$("#xo").hidden=true};
$("#xsv").onclick=()=>{const a=parseFloat($("#xa").value);if(!(a>0)){$("#xa").focus();return}const o={amt:a,cur:$("#xcur").value,cat:$("#xcat").value,date:$("#xd").value||today(),note:$("#xn").value.trim()};if(xid)Object.assign(E.find(x=>x.id===xid),o);else E.push({id:"e"+Date.now(),...o});saveE();$("#xo").hidden=true;money()};
$("#xdel").onclick=()=>{if(confirm("確定刪除這筆紀錄？")){E=E.filter(x=>x.id!==xid);saveE();$("#xo").hidden=true;money()}};
let ce="",cfrom=false;
const cval=()=>{const x=ce.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");if(!x||!/^[0-9+\-*/. ]+$/.test(x))return NaN;try{const v=Function('"use strict";return ('+x+')')();return isFinite(v)?v:NaN}catch(e){return NaN}};
function cshow(){$("#cdisp").textContent=ce||"0";const v=cval();$("#chint").textContent=isNaN(v)?"":`= ${Math.round(v*100)/100}　≈ NT$${nf(v*RATE)}（以日圓計，匯率 ${RATE}）`}
function openC(f){cfrom=f;ce=f&&$("#xa").value?String($("#xa").value):"";$("#cuse").hidden=!f;cshow();$("#co").hidden=false}
$("#mcalc").onclick=()=>openC(false);
$("#xcalc").onclick=()=>openC(true);
$("#ccl").onclick=()=>{$("#co").hidden=true};
$("#cuse").onclick=()=>{const v=cval();if(!isNaN(v))$("#xa").value=Math.round(v*100)/100;$("#co").hidden=true};
$("#ckp").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;
 if(k==="C")ce="";else if(k==="B")ce=ce.slice(0,-1);else if(k==="="){const v=cval();if(!isNaN(v))ce=String(Math.round(v*100)/100)}else ce+=k;cshow()};

let M;try{M=JSON.parse(localStorage.getItem("memos"))}catch(e){}if(!Array.isArray(M))M=[];
const saveM=()=>{try{localStorage.setItem("memos",JSON.stringify(M))}catch(e){alert("儲存空間不足，請刪除一些備忘後再試")}};
function memos(){$("#mlist").innerHTML=M.length?M.map(m=>`<div class="gi" data-id="${m.id}"><div class="b"><div class="t">${esc(m.title||"（無標題）")}</div><div class="hr mt">${esc(m.body)}</div><div class="hr">${esc(m.at)}</div></div></div>`).join(""):'<p class="hr">還沒有備忘，按右上「＋新增」寫下第一則。</p>'}
let mid=null;
function openM(id){mid=id;const m=id?M.find(x=>x.id===id):{title:"",body:""};$("#mti").value=m.title;$("#mbo").value=m.body;$("#mdel").hidden=!id;$("#mo").hidden=false}
$("#madd").onclick=()=>openM(null);
$("#mlist").onclick=e=>{const r=e.target.closest(".gi");if(r)openM(r.dataset.id)};
$("#mcl").onclick=()=>{$("#mo").hidden=true};
$("#msv").onclick=()=>{const t=$("#mti").value.trim(),b=$("#mbo").value.trim();if(!t&&!b){$("#mti").focus();return}const at=new Date().toLocaleString("zh-TW",{hour12:false,month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});if(mid)Object.assign(M.find(x=>x.id===mid),{title:t,body:b,at});else M.unshift({id:"m"+Date.now(),title:t,body:b,at});saveM();$("#mo").hidden=true;memos()};
$("#mdel").onclick=()=>{if(confirm("確定刪除這則備忘？")){M=M.filter(x=>x.id!==mid);saveM();$("#mo").hidden=true;memos()}};

try{const s=+localStorage.getItem("day");if(s>=0&&s<D.length)cur=s}catch(e){}
initMap();gifts();memos();money();setDay(cur);tab("plan");
</script>
</body>
</html>
